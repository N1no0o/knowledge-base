name: Build index

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'tools/**'
      - 'log.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild index
        run: python tools/build_index.py

      - name: Report health
        run: python tools/build_index.py --check
        continue-on-error: true

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain index.md search-index.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.md search-index.json
            git commit -m "chore: rebuild index"
            git push
          else
            echo "索引无变化,跳过提交"
          fi
